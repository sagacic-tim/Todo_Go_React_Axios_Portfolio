name: todo_axios_api

services:
  db:
    image: postgres:17
    container_name: todo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: ${POSTGRES_DB:-todo_axios_api}
    volumes:
      - todo_db_data:/var/lib/postgresql/data
    networks:
      - todo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todo_axios_api}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sagacic-tim}/todo_axios_api_api:local
    container_name: todo_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_USER: ${POSTGRES_USER:-todo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-todo_axios_api}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    networks:
      - todo_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sagacic-tim}/todo_axios_api_web:local
    container_name: todo_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:80"
    networks:
      - todo_net

volumes:
  todo_db_data:

networks:
  todo_net:
    driver: bridge
