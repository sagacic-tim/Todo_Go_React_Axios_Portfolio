name: Build & Validate (Backend + Frontend)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend / build
    runs-on: ubuntu-24.04

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_axios_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U todo -d todo_axios_api"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      DB_USER: todo
      DB_PASSWORD: todo
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: todo_axios_api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Wait for Postgres
        run: |
          until pg_isready --host=localhost --port=5432 --username=todo --dbname=todo_axios_api; do
            echo "Waiting for Postgres..."
            sleep 1
          done

      - name: Build backend
        run: go build ./cmd/server

      - name: Run backend tests
        run: go test ./...

  frontend:
    name: frontend / build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
